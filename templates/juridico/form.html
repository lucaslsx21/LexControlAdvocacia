{% extends 'base.html' %}{% block content %}<div class="page-head">
    <div>
        <h1>{{ titulo }}</h1>
        <p>Preencha os dados e salve o registro.</p>
    </div>
</div>
<form method="post" class="panel form-grid">{% csrf_token %}{% for field in form %}<div
        class="field {% if field.name == 'descricao' or field.name == 'resumo_profissional' or field.name == 'formacao' %}wide{% endif %}">
        <label>{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small class="error">{{ error
            }}</small>{% endfor %}</div>{% endfor %}<div class="wide actions"><button type="button" class="btn"
            onclick="history.back()">Cancelar</button><button class="btn primary">Salvar</button></div>
</form>{% endblock %}
